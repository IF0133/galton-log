<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/galton-log/">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#F7F7F4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="日々の小さな行動を、玉にして残す。Galton Logは、記録するたびに玉が積み重なる行動記録アプリです。">
  <meta property="og:title" content="Galton Log">
  <meta property="og:description" content="日々の小さな行動を、玉にして残す。小さな積み重ねが、自分への自信になる。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Galton Log">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Galton Log</title>
  <style>
    html, body { margin: 0; background: #F7F7F4; color: #243C37; }
    #flutter_host { width: 100%; position: relative; overflow: clip; }
    #app-startup { position: fixed; inset: 0; z-index: 3; overflow: auto; background: #F7F7F4; font-family: system-ui, sans-serif; }
    .startup-content { box-sizing: border-box; max-width: 420px; margin: auto; padding: 15vh 24px 32px; text-align: center; line-height: 1.7; }
    .startup-content img { border-radius: 20px; }
    .startup-content h1 { font-size: 28px; margin: 12px 0; }
    .startup-content p { margin: 12px 0; }
    .startup-content a { color: #08685E; text-underline-offset: 4px; display: inline-block; padding: 12px 4px; }
    .startup-content button { font: inherit; border: 0; border-radius: 8px; padding: 12px 20px; background: #0F766E; color: white; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app-startup">
    <div class="startup-content">
      <img src="icons/Icon-192.png" width="80" height="80" alt="">
      <h1>Galton Log</h1>
      <p>日々の小さな行動を、玉にして残す。</p>
      <p id="startup-status" role="status">読み込み中…</p>
      <button id="startup-retry" type="button" hidden>再読み込み</button>
      <p><a href="guide.html">使い方・データの保存について</a></p>
      <noscript><p>アプリを使うにはJavaScriptを有効にしてください。使い方の案内は上のリンクから確認できます。</p></noscript>
    </div>
  </div>
  <div id="flutter_host"></div>
  <script src="page_scroll.js"></script>
  <script src="app_startup.js"></script>
  <script id="flutter-bootstrap" src="flutter_bootstrap.js" async></script>
</body>
</html>
